---
- hosts: web
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Copy website
      copy:
        src: index.html
        dest: /var/www/html/index.html

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes